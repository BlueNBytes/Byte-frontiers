<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Byte Frontiers — Account</title>
<link rel="stylesheet" href="style.css">
<style>
body{min-height:100vh;display:grid;place-items:center;background:#090d1b url("assets/backgrounds/intro-screen.png") center/cover no-repeat;color:#fff;font-family:Arial,sans-serif}
.auth-card{width:min(92vw,390px);padding:28px;background:#10182aee;border:1px solid #6c5ce7;border-radius:16px;box-shadow:0 12px 45px #0009}
.auth-card h1{margin-top:0;color:#a99bff}.auth-card label{display:block;margin:14px 0 6px}.auth-card input{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;border:1px solid #59627a;background:#080d19;color:white}.auth-card button img{width:18px;height:18px;vertical-align:middle}.auth-card button{margin:14px 8px 0 0;padding:11px 16px;border:0;border-radius:8px;background:#6c5ce7;color:white;font-weight:bold;cursor:pointer}.auth-card #status{min-height:1.2em;color:#ffb6b6}.auth-card a{color:#c4bbff}
</style>
</head><body><main class="auth-card">
<h1>BYTE FRONTIERS</h1><p>Create an account or sign in. Your save is stored in this browser.</p>
<form id="auth-form">
<label for="username">Username</label><input id="username" name="username" minlength="3" maxlength="20" autocomplete="username" required>
<label for="password">Password</label><input id="password" name="password" type="password" minlength="8" autocomplete="current-password" required>
<label for="email">Email (optional for sign up)</label><input id="email" name="email" type="email" autocomplete="email">
<div><button type="submit" value="login"><img src="assets/ui/ok.svg" alt=""> Log In</button><button type="submit" value="register"><img src="assets/ui/training.svg" alt=""> Sign Up</button></div>
<p id="status" role="status"></p><p><a href="index.html">Continue to game</a></p>
</form></main>
<script src="account-store.js"></script>
<script>
const form=document.getElementById('auth-form'),statusEl=document.getElementById('status');
form.addEventListener('submit',async e=>{
 e.preventDefault(); const action=e.submitter?.value||'login';
 const username=form.username.value.trim(),password=form.password.value,email=form.email.value.trim();
 if(action==='register'&&password.length<8){statusEl.textContent='Use a password with at least 8 characters.';return;}
 statusEl.style.color='#d8d2ff';statusEl.textContent='Checking account…';
 try {
  const account = action==='register'
   ? await BFAccounts.register(username,password,email)
   : await BFAccounts.login(username,password);
  localStorage.setItem('bf_auth_token',account.username);
  localStorage.setItem('bf_username',account.username);
  statusEl.style.color='#9cffc3';statusEl.textContent='Success! Opening your game…';
  location.href='index.html';
 } catch(err) { statusEl.style.color='#ffb6b6';statusEl.textContent=err.message||'Could not access this browser’s account storage.'; }
});
</script></body></html>
